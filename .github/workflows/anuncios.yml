name: Anuncios diario

on:
  schedule:
    # Respaldo del Mac (src/local-run.js corre los anuncios a las 7:00). Google casi siempre funciona desde aquí;
    # Meta suele bloquear a los servidores de GitHub, y en ese caso se conserva lo que publicó el Mac.
    # Horas en UTC (Lima = UTC−5).
    - cron: '45 13 * * *'   # 8:45 a. m.
  # Prueba: al subir cambios a la rama monitor-anuncios corre la captura completa pero NO publica;
  # deja el resultado como artefacto descargable de la corrida.
  push:
    branches: [monitor-anuncios]
    paths: ['src/anuncios.js', 'src/anuncios-publish.js', 'anuncios.json', '.github/workflows/anuncios.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'IDs de marcas separados por coma (vacío = todas)'
        required: false
        default: ''
      source:
        description: 'Fuente: meta, google o vacío para ambas'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: anuncios
  cancel-in-progress: false

jobs:
  anuncios:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUT_DIR: site
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4

      # Lo publicado: el día anterior (para marcar lo nuevo) y las miniaturas que ya existen.
      - name: Traer historial publicado
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD anuncios 2>/dev/null | tar -x -C site || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache de Playwright y del idioma de OCR
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/tesseract
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Capturar anuncios
        env:
          ONLY: ${{ github.event.inputs.only }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          set --
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ -n "$SOURCE" ] && set -- "$@" --source "$SOURCE"
          node --no-deprecation src/anuncios.js "$@"

      - name: Resumen de la captura
        if: always()
        run: |
          f=$(ls site/anuncios/data/2*.json 2>/dev/null | sort | tail -1)
          [ -z "$f" ] && { echo "No se generó el archivo del día"; exit 0; }
          echo "Archivo: $f"
          jq -r '"META", (.meta.brands[] | "  \(.name): \(.status) · \(.count) con palabra clave de \(.seen // 0) · \(.error // "")"),
                 "GOOGLE", (.google.brands[] | "  \(.name): \(.status) · \(.count) nuevos · \(.cyber) Cyber · \(.error // "")"),
                 "Clasificación Google: \([.google.ads[].cyber] | group_by(.) | map("\(.[0]): \(length)") | join(", "))",
                 "Miniaturas: Meta \([.meta.ads[] | select(.img)] | length)/\(.meta.ads | length) · Google \([.google.ads[] | select(.img)] | length)/\(.google.ads | length)"' "$f" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultado de la prueba
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: anuncios-prueba
          path: site/anuncios
          retention-days: 7

      - name: Publicar en gh-pages
        if: github.event_name != 'push'
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node src/anuncios-publish.js --from site
