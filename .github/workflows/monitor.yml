name: Monitor diario

on:
  schedule:
    # 12:30 UTC = 7:30 a. m. en Lima. GitHub puede retrasar los cron unos minutos.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'IDs de sitios separados por coma (vacío = todos)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: site
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache de Playwright y del idioma de OCR
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/tesseract
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Los datos y capturas viven en la rama gh-pages (que es la que sirve GitHub Pages).
      - name: Traer historial publicado
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C site
          fi
          rm -f site/index.html && rm -rf site/assets

      - name: Capturar homes
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node --no-deprecation src/monitor.js --only "${{ github.event.inputs.only }}"
          else
            node --no-deprecation src/monitor.js
          fi

      - name: Borrar capturas antiguas
        run: node src/prune.js

      - name: Armar sitio
        run: |
          cp index.html site/
          cp -r assets site/
          touch site/.nojekyll

      # Se publica como un único commit (sin historial) para que el repo no crezca con las imágenes.
      - name: Publicar en gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Monitor $(date +%F)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
