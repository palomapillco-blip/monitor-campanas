name: Monitor diario

on:
  schedule:
    # 12:30 UTC = 7:30 a. m. en Lima. GitHub puede retrasar los cron unos minutos.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'IDs de sitios separados por coma (vacío = todos)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: site
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache de Playwright y del idioma de OCR
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/tesseract
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Los datos y capturas viven en la rama gh-pages (que es la que sirve GitHub Pages).
      - name: Traer historial publicado
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C site
          fi
          rm -f site/index.html && rm -rf site/assets

      - name: Capturar homes
        env:
          # Los sitios con "runner": "local" (p. ej. Ripley) los captura el Mac: ver src/local-run.js.
          MONITOR_RUNNER: github
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node --no-deprecation src/monitor.js --only "${{ github.event.inputs.only }}"
          else
            node --no-deprecation src/monitor.js
          fi

      # Mezcla con lo ya publicado (sin pisar lo que publicó el Mac) y sube un único commit sin historial.
      - name: Publicar en gh-pages
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node src/publish.js --from site
